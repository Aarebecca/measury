<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Width Browser Test</title>
  <link rel="stylesheet" href="fonts.css">
  <script src="font-mapping.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      max-width: 1600px;
      margin: 0 auto 20px;
      font-size: 28px;
    }

    h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .test-section {
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-width: 1600px;
    }

    /* 两栏布局容器 */
    .two-column-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1600px;
      margin: 30px auto;
    }

    .left-column,
    .right-column {
      min-width: 0;
      /* 防止内容溢出 */
    }

    .preset-tests-section {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      height: 100%;
    }

    .preset-tests-section h2 {
      margin-top: 0;
      color: #333;
    }

    .code-output-section {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f5f5f5;
      height: 100%;
      position: sticky;
      top: 20px;
    }

    .code-output-section h2 {
      margin-top: 0;
      color: #333;
    }

    /* 响应式布局 */
    @media (max-width: 1200px) {
      .two-column-layout {
        grid-template-columns: 1fr;
      }

      .custom-preview-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .test-item {
      margin: 20px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 4px;
    }

    .measurement-box {
      display: inline-block;
      outline: 2px solid #4CAF50;
      background: #fff;
      position: relative;
    }

    .measurement-box svg {
      display: block;
      overflow: visible;
    }

    .measurement-baseline {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: red;
      opacity: 0.5;
      pointer-events: none;
    }

    .custom-preview-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .preview-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      padding: 10px;
    }

    .preview-card h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #333;
    }

    .preview-stage {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafb;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .preview-metrics {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #333;
      margin-bottom: 8px;
    }

    .preview-metrics div {
      margin: 2px 0;
    }

    .preview-structure-title {
      font-size: 12px;
      font-weight: bold;
      color: #444;
      margin-bottom: 4px;
    }

    .preview-structure pre {
      margin: 0;
      padding: 8px;
      font-size: 11px;
      line-height: 1.4;
      background: #f4f6f8;
      border-radius: 4px;
      overflow-x: auto;
      white-space: pre;
      color: #445;
    }

    .html-preview-text {
      display: inline-block;
      color: #111;
    }

    .canvas-preview {
      display: block;
    }

    @media (max-width: 900px) {
      .custom-preview-grid {
        grid-template-columns: 1fr;
      }
    }

    .results {
      margin-top: 10px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #666;
    }

    .results div {
      margin: 5px 0;
    }

    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      border-radius: 4px;
    }

    .comparison div {
      padding: 5px;
    }

    .comparison .label {
      font-weight: bold;
      color: #333;
    }

    .comparison .match {
      color: #4CAF50;
    }

    .comparison .mismatch {
      color: #f44336;
    }

    button {
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 10px 10px 0;
    }

    button:hover {
      background: #45a049;
    }

    button.secondary {
      background: #2196F3;
    }

    button.secondary:hover {
      background: #0b7dda;
    }

    .code-actions {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
    }

    .copy-feedback {
      display: inline-block;
      margin-left: 10px;
      color: #4CAF50;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copy-feedback.show {
      opacity: 1;
    }

    #output {
      padding: 15px;
      background: #fff;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      max-height: 600px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid #ddd;
    }

    #output:empty::before {
      content: '运行测试后，生成的代码将显示在这里...';
      color: #999;
      font-style: italic;
    }

    .test-case {
      margin: 10px 0;
      padding: 10px;
      background: #fff;
      border-left: 3px solid #2196F3;
      font-size: 14px;
    }

    .test-case h3 {
      margin-top: 0;
      font-size: 16px;
    }

    #testResults {
      max-height: 600px;
      overflow-y: auto;
    }

    #testResults:empty::before {
      content: '点击"运行所有测试"查看结果...';
      color: #999;
      font-style: italic;
    }

    .font-status {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-weight: bold;
    }

    .font-status.loading {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
    }

    .font-status.loaded {
      background: #d4edda;
      color: #155724;
      border: 1px solid #28a745;
    }

    .font-status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #dc3545;
    }
  </style>
</head>

<body>
  <h1>Text Width 浏览器测试工具</h1>

  <!-- 字体加载状态 -->
  <div id="fontStatus" class="font-status loading">
    ⏳ 正在加载字体...
  </div>

  <div class="test-section">
    <h2>使用说明</h2>
    <p>1. 页面会自动加载 test-browser/fonts 目录下的字体文件</p>
    <p>2. 在"自定义测试"中选择字体并输入文本进行测量</p>
    <p>3. 结果会显示浏览器 HTML 实际测量值（作为目标值），并提供 SVG/Canvas 对照</p>
    <p>4. 点击"生成测试代码"可以生成对应的测试用例代码，代码中会使用当前选择的字体</p>
  </div>

  <div class="test-section">
    <h2>自定义测试</h2>
    <div>
      <label>文本内容：<input type="text" id="customText" value="Hello World" style="width: 300px; padding: 5px;"></label>
    </div>
    <div style="margin-top: 10px;">
      <label>字体：
        <select id="customFont" style="width: 200px; padding: 5px;">
          <!-- 字体选项将由 JavaScript 动态生成 -->
        </select>
      </label>
    </div>
    <div style="margin-top: 10px;">
      <label>字号：<input type="number" id="customSize" value="16" style="width: 100px; padding: 5px;"> px</label>
    </div>
    <div style="margin-top: 10px;">
      <label>字重：
        <select id="customWeight" style="width: 100px; padding: 5px;">
          <option value="100">100 - Thin</option>
          <option value="200">200 - Extra Light</option>
          <option value="300">300 - Light</option>
          <option value="400" selected>400 - Regular</option>
          <option value="500">500 - Medium</option>
          <option value="600">600 - Semi Bold</option>
          <option value="700">700 - Bold</option>
          <option value="800">800 - Extra Bold</option>
          <option value="900">900 - Black</option>
        </select>
      </label>
    </div>
    <button onclick="testCustom()">测量</button>
    <button onclick="generateTestCodeFromCustom()">生成当前测试代码</button>
    <div id="customResult"></div>
  </div>

  <!-- 两栏布局：预设测试和代码输出 -->
  <div class="two-column-layout">
    <!-- 左侧：预设测试用例 -->
    <div class="left-column">
      <div class="preset-tests-section">
        <h2>预设测试用例</h2>
        <div>
          <button onclick="runAllTests()">运行所有测试</button>
          <button onclick="generateTestCode()">生成所有测试代码</button>
        </div>
        <div id="testResults"></div>
      </div>
    </div>

    <!-- 右侧：测试代码输出 -->
    <div class="right-column">
      <div class="code-output-section">
        <h2>测试代码输出</h2>
        <div class="code-actions">
          <button class="secondary" onclick="copyOutputToClipboard()">📋 复制代码</button>
          <span id="copyFeedback" class="copy-feedback">✓ 已复制!</span>
        </div>
        <div id="output"></div>
      </div>
    </div>
  </div>

  <script>
    // 生成默认字体映射
    function getDefaultFontMapping(fontName) {
      // 移除开头的下划线，移除中间的空格
      const cleanName = fontName.replace(/\s+/g, '');
      const varName = cleanName.match(/^[_\d]/) ? '_' + cleanName : cleanName;
      return {
        displayName: fontName,
        varName,
        fileName: cleanName
      };
    }

    // 获取字体映射（优先使用 fontMapping，否则使用默认规则）
    function getFontMapping(fontName) {
      return fontMapping[fontName] || getDefaultFontMapping(fontName);
    }

    // 从 CSS 中解析字体列表
    async function loadAvailableFonts() {
      try {
        const response = await fetch('./fonts.css');
        const cssText = await response.text();

        // 使用正则表达式提取所有 font-family 名称
        const fontFaceRegex = /@font-face\s*{[^}]*font-family:\s*['"]([^'"]+)['"]/g;
        const fonts = new Set();

        let match;
        while ((match = fontFaceRegex.exec(cssText)) !== null) {
          fonts.add(match[1]);
        }

        // 填充字体选择框
        const fontSelect = document.getElementById('customFont');
        fontSelect.innerHTML = '';

        fonts.forEach(font => {
          const option = document.createElement('option');
          option.value = font;
          const mapping = getFontMapping(font);
          option.textContent = mapping.displayName;
          fontSelect.appendChild(option);
        });

        return Array.from(fonts);
      } catch (error) {
        console.error('加载字体列表失败:', error);
        // 降级到默认字体列表
        const fontSelect = document.getElementById('customFont');
        fontSelect.innerHTML = `
          <option value="Alibaba PuHuiTi">Alibaba PuHuiTi (阿里巴巴普惠体)</option>
          <option value="Source Han Sans">Source Han Sans (思源黑体)</option>
          <option value="Source Han Serif">Source Han Serif (思源宋体)</option>
          <option value="Arial">Arial (Arial)</option>
        `;
        return ['Alibaba PuHuiTi', 'Source Han Sans', 'Source Han Serif', 'Arial'];
      }
    }

    // 检测字体加载状态
    async function checkFontLoading() {
      const fontStatus = document.getElementById('fontStatus');

      try {
        // 先加载字体列表
        const availableFonts = await loadAvailableFonts();

        // 使用 Font Loading API 检测所有字体
        if ('fonts' in document) {
          const loadPromises = availableFonts.map(font =>
            document.fonts.load(`16px "${font}"`)
          );

          await Promise.all(loadPromises);

          // 检查每个字体是否真的可用
          const loadedFonts = [];
          const failedFonts = [];

          for (const font of availableFonts) {
            const fontAvailable = document.fonts.check(`16px "${font}"`);
            if (fontAvailable) {
              loadedFonts.push(font);
            } else {
              failedFonts.push(font);
            }
          }

          if (failedFonts.length === 0) {
            fontStatus.className = 'font-status loaded';
            fontStatus.innerHTML = `✅ 所有字体加载成功：${loadedFonts.join(', ')}`;
          } else if (loadedFonts.length > 0) {
            fontStatus.className = 'font-status loaded';
            fontStatus.innerHTML = `⚠️ 部分字体加载成功：${loadedFonts.join(', ')}<br>未加载：${failedFonts.join(', ')}`;
          } else {
            fontStatus.className = 'font-status error';
            fontStatus.innerHTML = '❌ 字体加载失败：请确保字体文件位于 ./fonts/ 目录下';
          }
        } else {
          // 降级方案：等待一段时间后假设加载成功
          setTimeout(() => {
            fontStatus.className = 'font-status loaded';
            fontStatus.innerHTML = '⚠️ 浏览器不支持字体检测 API，假设字体已加载';
          }, 1000);
        }
      } catch (error) {
        fontStatus.className = 'font-status error';
        fontStatus.innerHTML = '❌ 字体加载出错：' + error.message;
      }
    }

    // 页面加载时检测字体
    window.addEventListener('load', checkFontLoading);

    // 标准测试文本集合
    const standardTexts = {
      // 纯英文（无空格）
      pureEnglish: 'HelloWorld',
      // 纯英文（带空格）
      englishWithSpaces: 'Hello World',
      // 纯英文（带标点）
      englishWithPunctuation: 'Hello, World!',
      // 英文句子
      englishSentence: 'The quick brown fox jumps over the lazy dog.',
      // 纯中文（无标点）
      pureChinese: '你好世界',
      // 纯中文（带标点）
      chineseWithPunctuation: '你好，世界！',
      // 中文句子
      chineseSentence: '今天天气真不错，适合出去走走。',
      // 中英混排（无标点）
      mixed: 'Hello你好World',
      // 中英混排（带空格）
      mixedWithSpaces: 'Hello 你好 World',
      // 中英混排（带标点）
      mixedWithPunctuation: 'Hello, 你好！World.',
      // 数字
      numbers: '0123456789',
      // 数字与文本
      numbersWithText: 'Price: $123.45',
      // 特殊字符
      specialChars: '!@#$%^&*()_+-=[]{}|;:,.<>?',
      // emoji
      emoji: '😀😃😄😁',
      // 中英数字混合
      comprehensive: 'Product价格: $99.99元',
    };

    // 标准字号
    const standardFontSizes = [12, 16, 24, 48];

    // 动态生成测试用例（基于已加载的字体）
    function generateTestCases() {
      const cases = [];

      // 获取所有已加载的字体
      const fonts = Array.from(document.getElementById('customFont').options).map(opt => opt.value);

      fonts.forEach(font => {
        // 为每个字体生成标准测试用例
        standardFontSizes.forEach(fontSize => {
          // 基础测试（常用场景）
          cases.push({
            name: `${font} [${fontSize}px] - 纯英文带空格`,
            text: standardTexts.englishWithSpaces,
            style: { fontFamily: font, fontSize, fontWeight: 400 }
          });

          cases.push({
            name: `${font} [${fontSize}px] - 纯英文带标点`,
            text: standardTexts.englishWithPunctuation,
            style: { fontFamily: font, fontSize, fontWeight: 400 }
          });

          cases.push({
            name: `${font} [${fontSize}px] - 纯中文`,
            text: standardTexts.pureChinese,
            style: { fontFamily: font, fontSize, fontWeight: 400 }
          });

          cases.push({
            name: `${font} [${fontSize}px] - 纯中文带标点`,
            text: standardTexts.chineseWithPunctuation,
            style: { fontFamily: font, fontSize, fontWeight: 400 }
          });

          cases.push({
            name: `${font} [${fontSize}px] - 中英混排带空格`,
            text: standardTexts.mixedWithSpaces,
            style: { fontFamily: font, fontSize, fontWeight: 400 }
          });

          // 仅在 16px 时测试更多场景（避免测试用例过多）
          if (fontSize === 16) {
            cases.push({
              name: `${font} [${fontSize}px] - 纯英文无空格`,
              text: standardTexts.pureEnglish,
              style: { fontFamily: font, fontSize, fontWeight: 400 }
            });

            cases.push({
              name: `${font} [${fontSize}px] - 英文句子`,
              text: standardTexts.englishSentence,
              style: { fontFamily: font, fontSize, fontWeight: 400 }
            });

            cases.push({
              name: `${font} [${fontSize}px] - 中文句子`,
              text: standardTexts.chineseSentence,
              style: { fontFamily: font, fontSize, fontWeight: 400 }
            });

            cases.push({
              name: `${font} [${fontSize}px] - 中英混排带标点`,
              text: standardTexts.mixedWithPunctuation,
              style: { fontFamily: font, fontSize, fontWeight: 400 }
            });

            cases.push({
              name: `${font} [${fontSize}px] - 数字`,
              text: standardTexts.numbers,
              style: { fontFamily: font, fontSize, fontWeight: 400 }
            });

            cases.push({
              name: `${font} [${fontSize}px] - 数字与文本`,
              text: standardTexts.numbersWithText,
              style: { fontFamily: font, fontSize, fontWeight: 400 }
            });

            cases.push({
              name: `${font} [${fontSize}px] - 特殊字符`,
              text: standardTexts.specialChars,
              style: { fontFamily: font, fontSize, fontWeight: 400 }
            });

            cases.push({
              name: `${font} [${fontSize}px] - 综合测试`,
              text: standardTexts.comprehensive,
              style: { fontFamily: font, fontSize, fontWeight: 400 }
            });
          }
        });
      });

      return cases;
    }

    // 初始测试用例（在字体加载完成前使用）
    let testCases = [];

    // 字体的完整 metrics 映射（与代码库保持一致）
    const fontMetrics = {
      Arial: {
        ascender: 2189,
        descender: -555,
        lineGap: 0,
        unitsPerEm: 2048,
      },
      'Alibaba PuHuiTi': {
        ascender: 1060,
        descender: -340,
        lineGap: 0,
        unitsPerEm: 1000
      },
      'Source Han Sans': {
        ascender: 880,
        descender: -120,
        lineGap: 500,
        unitsPerEm: 1000
      },
      'Source Han Serif': {
        ascender: 1151,
        descender: -286,
        lineGap: 0,
        unitsPerEm: 1000
      },
      'LXGW WenKai': {
        ascender: 928,
        descender: -256,
        lineGap: 0,
        unitsPerEm: 1000
      },
      '851tegakizatsu': {
        ascender: 880,
        descender: -144,
        lineGap: 0,
        unitsPerEm: 1024
      },
    };

    const WIDTH_ABS_TOLERANCE = 0.8;
    const WIDTH_REL_TOLERANCE = 0.01;
    const HEIGHT_ABS_TOLERANCE = 0.6;

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    let canvasPreviewSeq = 0;

    function normalizePreviewText(text) {
      return text.length === 0 ? ' ' : text;
    }

    function buildMeasurementBox(content, measuredWidth, measuredHeight, measuredBaseline) {
      const width = Math.max(1, measuredWidth);
      const height = Math.max(1, measuredHeight);
      const baseline = Math.max(0, Math.min(height, measuredBaseline));

      return `
        <div class="measurement-box" style="width: ${width.toFixed(2)}px; height: ${height.toFixed(2)}px;">
          ${content}
          <span class="measurement-baseline" style="top: ${baseline.toFixed(2)}px;"></span>
        </div>
      `;
    }

    function buildSvgPreview(text, style, measured) {
      const previewText = normalizePreviewText(text);
      const escapedText = escapeHtml(previewText);
      const escapedFamily = escapeHtml(style.fontFamily);
      const fontSize = style.fontSize;
      const fontWeight = style.fontWeight || 400;
      const letterSpacing = style.letterSpacing || 0;
      const wordSpacing = style.wordSpacing || 0;
      const width = Math.max(1, measured.width);
      const height = Math.max(1, measured.actualHeight ?? measured.height);
      const baseline = Math.max(0, Math.min(height, measured.baseline));

      const content = `
        <svg width="${width.toFixed(2)}" height="${height.toFixed(2)}" viewBox="0 0 ${width.toFixed(2)} ${height.toFixed(2)}" aria-hidden="true">
          <text x="0" y="${baseline.toFixed(2)}" font-family="'${escapedFamily}'" font-size="${fontSize}" font-weight="${fontWeight}" letter-spacing="${letterSpacing}" word-spacing="${wordSpacing}" xml:space="preserve">${escapedText}</text>
        </svg>
      `;

      return buildMeasurementBox(content, width, height, baseline);
    }

    function buildHtmlPreview(text, style, measured) {
      const previewText = normalizePreviewText(text);
      const escapedText = escapeHtml(previewText);
      const escapedFamily = escapeHtml(style.fontFamily);
      const fontSize = style.fontSize;
      const fontWeight = style.fontWeight || 400;
      const letterSpacing = style.letterSpacing || 0;
      const wordSpacing = style.wordSpacing || 0;

      const content = `
        <div class="html-preview-text" style="font-family: '${escapedFamily}'; font-size: ${fontSize}px; font-weight: ${fontWeight}; letter-spacing: ${letterSpacing}px; word-spacing: ${wordSpacing}px; white-space: nowrap;">${escapedText}</div>
      `;

      return buildMeasurementBox(content, measured.width, measured.height, measured.baseline);
    }

    function measureHtmlPreview(text, style) {
      const previewText = normalizePreviewText(text);
      const div = document.createElement('div');
      div.style.position = 'absolute';
      div.style.visibility = 'hidden';
      div.style.left = '-99999px';
      div.style.top = '-99999px';
      div.style.whiteSpace = 'nowrap';
      div.style.fontFamily = `"${style.fontFamily.replace(/"/g, '\\"')}"`;
      div.style.fontSize = `${style.fontSize}px`;
      div.style.fontWeight = String(style.fontWeight || 400);
      div.style.letterSpacing = `${style.letterSpacing || 0}px`;
      div.style.wordSpacing = `${style.wordSpacing || 0}px`;
      div.textContent = previewText;

      document.body.appendChild(div);
      const rect = div.getBoundingClientRect();
      const computedStyle = window.getComputedStyle(div);
      document.body.removeChild(div);

      const lineHeight = parseFloat(computedStyle.lineHeight);
      const baseline = Number.isFinite(lineHeight)
        ? Math.min(rect.height, Math.max(0, lineHeight * 0.8))
        : Math.min(rect.height, style.fontSize * 0.8);

      return {
        width: text.length === 0 ? 0 : rect.width,
        height: text.length === 0 ? 0 : rect.height,
        baseline: text.length === 0 ? 0 : baseline,
      };
    }

    function measureCanvasPreview(text, style) {
      const previewText = normalizePreviewText(text);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      if (!ctx) {
        return {
          width: 0,
          height: 0,
          baseline: 0,
        };
      }

      const fontWeight = style.fontWeight || 400;
      const fontSize = style.fontSize;
      const fontFamily = style.fontFamily.replace(/"/g, '\\"');
      const letterSpacing = style.letterSpacing || 0;
      const wordSpacing = style.wordSpacing || 0;

      ctx.font = `${fontWeight} ${fontSize}px "${fontFamily}"`;
      ctx.textBaseline = 'alphabetic';

      const chars = Array.from(previewText);
      let width = 0;
      for (let i = 0; i < chars.length; i++) {
        const char = chars[i];
        width += ctx.measureText(char).width;
        if (i < chars.length - 1) width += letterSpacing;
        if (char === ' ') width += wordSpacing;
      }

      const metrics = ctx.measureText(previewText);
      let ascent = metrics.actualBoundingBoxAscent;
      let descent = metrics.actualBoundingBoxDescent;
      if (!Number.isFinite(ascent) || ascent <= 0) ascent = fontSize * 0.8;
      if (!Number.isFinite(descent) || descent < 0) descent = fontSize * 0.2;

      const height = ascent + descent;

      return {
        width: text.length === 0 ? 0 : width,
        height: text.length === 0 ? 0 : height,
        baseline: text.length === 0 ? 0 : ascent,
      };
    }

    function buildCanvasPreview(text, style, measured) {
      const previewText = normalizePreviewText(text);
      const width = Math.max(1, measured.width);
      const height = Math.max(1, measured.height);
      const baseline = Math.max(0, Math.min(height, measured.baseline));
      const canvasId = `canvasPreview${++canvasPreviewSeq}`;
      const encodedText = encodeURIComponent(previewText);
      const encodedFamily = encodeURIComponent(style.fontFamily);

      const content = `
        <canvas
          id="${canvasId}"
          class="canvas-preview"
          width="${Math.max(1, Math.ceil(width))}"
          height="${Math.max(1, Math.ceil(height))}"
          style="width: ${width.toFixed(2)}px; height: ${height.toFixed(2)}px;"
          data-text="${encodedText}"
          data-family="${encodedFamily}"
          data-size="${style.fontSize}"
          data-weight="${style.fontWeight || 400}"
          data-letter-spacing="${style.letterSpacing || 0}"
          data-word-spacing="${style.wordSpacing || 0}"
          data-baseline="${baseline.toFixed(2)}"
        ></canvas>
      `;

      return {
        id: canvasId,
        markup: buildMeasurementBox(content, width, height, baseline),
      };
    }

    function drawCanvasPreviewById(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const text = decodeURIComponent(canvas.dataset.text || ' ');
      const fontFamily = decodeURIComponent(canvas.dataset.family || 'sans-serif');
      const fontSize = Number(canvas.dataset.size || 16);
      const fontWeight = Number(canvas.dataset.weight || 400);
      const letterSpacing = Number(canvas.dataset.letterSpacing || 0);
      const wordSpacing = Number(canvas.dataset.wordSpacing || 0);
      const baseline = Number(canvas.dataset.baseline || 0);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#111';
      ctx.textBaseline = 'alphabetic';
      ctx.font = `${fontWeight} ${fontSize}px "${fontFamily.replace(/"/g, '\\"')}"`;

      const chars = Array.from(text);
      let x = 0;
      for (let i = 0; i < chars.length; i++) {
        const char = chars[i];
        ctx.fillText(char, x, baseline);
        x += ctx.measureText(char).width;
        if (i < chars.length - 1) x += letterSpacing;
        if (char === ' ') x += wordSpacing;
      }
    }

    function buildPreviewCard(title, previewMarkup, metrics, structureCode) {
      return `
        <div class="preview-card">
          <h3>${title}</h3>
          <div class="preview-stage">${previewMarkup}</div>
          <div class="preview-metrics">
            <div>宽度: ${metrics.width.toFixed(2)}px</div>
            <div>高度: ${metrics.height.toFixed(2)}px</div>
            <div>基线: ${metrics.baseline.toFixed(2)}px</div>
          </div>
          <div class="preview-structure">
            <div class="preview-structure-title">结构</div>
            <pre>${escapeHtml(structureCode)}</pre>
          </div>
        </div>
      `;
    }

    function buildSvgStructure(text, style, metrics) {
      const previewText = normalizePreviewText(text);
      return [
        `<svg width="${Math.max(1, metrics.width).toFixed(2)}" height="${Math.max(1, metrics.height).toFixed(2)}">`,
        `  <text x="0" y="${metrics.baseline.toFixed(2)}" font-family="${style.fontFamily}"`,
        `    font-size="${style.fontSize}" font-weight="${style.fontWeight || 400}" xml:space="preserve">`,
        `    ${previewText}`,
        `  </text>`,
        `</svg>`,
      ].join('\n');
    }

    function buildHtmlStructure(text, style) {
      const previewText = normalizePreviewText(text);
      return [
        `<div style="font-family:'${style.fontFamily}'; font-size:${style.fontSize}px; font-weight:${style.fontWeight || 400};`,
        `  letter-spacing:${style.letterSpacing || 0}px; word-spacing:${style.wordSpacing || 0}px; white-space:nowrap;">`,
        `  ${previewText}`,
        `</div>`,
      ].join('\n');
    }

    function buildCanvasStructure(text, style, metrics) {
      const previewText = normalizePreviewText(text);
      return [
        `const canvas = document.createElement('canvas');`,
        `const ctx = canvas.getContext('2d');`,
        `ctx.font = '${style.fontWeight || 400} ${style.fontSize}px "${style.fontFamily}"';`,
        `ctx.textBaseline = 'alphabetic';`,
        `ctx.fillText(${JSON.stringify(previewText)}, 0, ${metrics.baseline.toFixed(2)});`,
      ].join('\n');
    }

    function buildMeasuryStructure(text, style) {
      return [
        `const metrics = measureText(${JSON.stringify(text)}, {`,
        `  fontFamily: '${style.fontFamily}',`,
        `  fontSize: ${style.fontSize},`,
        `  fontWeight: ${style.fontWeight || 400},`,
        `});`,
      ].join('\n');
    }

    async function measureText(text, style) {
      // 等待字体加载完成
      if ('fonts' in document) {
        try {
          await document.fonts.load(`${style.fontWeight || 400} ${style.fontSize}px "${style.fontFamily}"`);
        } catch (e) {
          console.warn('字体加载失败:', e);
        }
      }

      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.style.position = 'absolute';
      svg.style.visibility = 'hidden';
      svg.style.overflow = 'visible';
      svg.style.left = '-99999px';
      svg.style.top = '-99999px';

      const textElement = document.createElementNS(svgNS, 'text');
      textElement.setAttribute('x', '0');
      textElement.setAttribute('y', '0');
      textElement.setAttribute('xml:space', 'preserve');
      textElement.setAttribute('font-family', `"${style.fontFamily.replace(/"/g, '\\"')}"`);
      textElement.setAttribute('font-size', String(style.fontSize));
      textElement.setAttribute('font-weight', String(style.fontWeight || 400));
      if (style.letterSpacing !== undefined) {
        textElement.setAttribute('letter-spacing', String(style.letterSpacing));
      }
      if (style.wordSpacing !== undefined) {
        textElement.setAttribute('word-spacing', String(style.wordSpacing));
      }
      const measuredText = text.length === 0 ? ' ' : text;
      textElement.textContent = measuredText;

      svg.appendChild(textElement);
      document.body.appendChild(svg);
      const bbox = textElement.getBBox();
      const actualWidth = text.length === 0 ? 0 : bbox.width;
      const actualHeight = text.length === 0 ? 0 : bbox.height;

      // 获取字体 metrics
      const metrics = fontMetrics[style.fontFamily];
      const fontSize = style.fontSize;

      // 计算高度（使用字体 metrics，与代码库保持一致）
      let height;
      if (metrics) {
        const { ascender, descender, lineGap = 0 } = metrics;
        const totalHeight = ascender - descender + lineGap;
        height = (totalHeight / metrics.unitsPerEm) * fontSize;
      } else {
        // 降级：使用浏览器实际渲染高度
        height = actualHeight;
      }

      // 计算 baseline（使用字体的 ascender 比例）
      let baseline;
      if (metrics) {
        baseline = fontSize * (metrics.ascender / metrics.unitsPerEm);
      } else {
        // SVG text 的基线位置（y=0），基线到顶部距离约为 -bbox.y
        baseline = text.length === 0 ? 0 : -bbox.y;
      }

      const lineHeight = height;
      const htmlMetrics = measureHtmlPreview(text, style);
      document.body.removeChild(svg);

      return {
        // 目标值：使用 HTML 测量结果
        width: htmlMetrics.width,
        height: height,
        actualHeight: htmlMetrics.height,
        lineHeight: lineHeight,
        baseline: baseline,
        // 调试/对照信息
        htmlWidth: htmlMetrics.width,
        htmlHeight: htmlMetrics.height,
        htmlBaseline: htmlMetrics.baseline,
        svgWidth: actualWidth,
        svgHeight: actualHeight,
      };
    }

    async function testCustom() {
      const text = document.getElementById('customText').value;
      const fontFamily = document.getElementById('customFont').value;
      const fontSize = parseInt(document.getElementById('customSize').value);
      const fontWeight = parseInt(document.getElementById('customWeight').value);

      const previewStyle = {
        fontFamily,
        fontSize,
        fontWeight,
        letterSpacing: 0,
        wordSpacing: 0,
      };

      const result = await measureText(text, previewStyle);
      const svgPreviewMetrics = {
        width: result.svgWidth,
        height: result.svgHeight,
        baseline: result.baseline,
      };
      const htmlPreviewMetrics = {
        width: result.htmlWidth,
        height: result.htmlHeight,
        baseline: result.htmlBaseline,
      };
      const canvasPreviewMetrics = measureCanvasPreview(text, previewStyle);
      const canvasPreview = buildCanvasPreview(text, previewStyle, canvasPreviewMetrics);

      // 保存当前测试结果供生成代码使用
      window.currentCustomTest = {
        text,
        style: { fontFamily, fontSize, fontWeight },
        measured: result
      };

      const svgCard = buildPreviewCard(
        'SVG 渲染',
        buildSvgPreview(text, previewStyle, svgPreviewMetrics),
        svgPreviewMetrics,
        buildSvgStructure(text, previewStyle, svgPreviewMetrics)
      );

      const htmlCard = buildPreviewCard(
        'HTML 渲染',
        buildHtmlPreview(text, previewStyle, htmlPreviewMetrics),
        htmlPreviewMetrics,
        buildHtmlStructure(text, previewStyle)
      );

      const canvasCard = buildPreviewCard(
        'Canvas 渲染',
        canvasPreview.markup,
        canvasPreviewMetrics,
        buildCanvasStructure(text, previewStyle, canvasPreviewMetrics)
      );

      const measuryPreviewMetrics = {
        width: result.width,
        height: result.height,
        baseline: result.baseline,
      };
      const measuryCard = buildPreviewCard(
        'Measury 计算',
        buildSvgPreview(text, previewStyle, measuryPreviewMetrics),
        measuryPreviewMetrics,
        buildMeasuryStructure(text, previewStyle)
      );

      const resultDiv = document.getElementById('customResult');
      resultDiv.innerHTML = `
        <div class="test-item">
          <div class="custom-preview-grid">
            ${measuryCard}
            ${svgCard}
            ${htmlCard}
            ${canvasCard}
          </div>
          <div style="margin-top: 10px; padding: 10px; background: #e3f2fd; border-radius: 4px;">
            <strong>快速测试代码:</strong>
            <pre style="margin: 5px 0;">const metrics = measureText('${text}', {
  fontFamily: '${fontFamily}',
  fontSize: ${fontSize},
  fontWeight: ${fontWeight},
});

expect(Math.abs(metrics.width - ${result.width.toFixed(2)})).toBeLessThanOrEqual(Math.max(${WIDTH_ABS_TOLERANCE}, Math.abs(${result.width.toFixed(2)}) * ${WIDTH_REL_TOLERANCE}));
expect(Math.abs(metrics.height - ${result.actualHeight.toFixed(2)})).toBeLessThanOrEqual(${HEIGHT_ABS_TOLERANCE});</pre>
          </div>
        </div>
      `;

      drawCanvasPreviewById(canvasPreview.id);
    }

    // 从当前自定义测试生成完整测试代码
    function generateTestCodeFromCustom() {
      if (!window.currentCustomTest) {
        alert('请先运行自定义测试！');
        return;
      }

      const r = window.currentCustomTest;
      const { fontFamily, fontSize, fontWeight } = r.style;

      const mapping = getFontMapping(fontFamily);

      const styleName = weightToStyle[fontWeight] || 'Regular';
      const importVarName = `${mapping.varName}${styleName}`;

      // 生成导入语句
      const imports = `import { describe, expect, it, beforeAll } from 'vitest';
import { measureText, registerFont } from '../src';
import ${importVarName} from '../src/fonts/${mapping.fileName}-${styleName}';

const WIDTH_ABS_TOLERANCE = ${WIDTH_ABS_TOLERANCE};
const WIDTH_REL_TOLERANCE = ${WIDTH_REL_TOLERANCE};
const HEIGHT_ABS_TOLERANCE = ${HEIGHT_ABS_TOLERANCE};

function expectWidthMatch(actual: number, expected: number): void {
  const allowed = Math.max(WIDTH_ABS_TOLERANCE, Math.abs(expected) * WIDTH_REL_TOLERANCE);
  expect(Math.abs(actual - expected)).toBeLessThanOrEqual(allowed);
}

function expectHeightMatch(actual: number, expected: number): void {
  expect(Math.abs(actual - expected)).toBeLessThanOrEqual(HEIGHT_ABS_TOLERANCE);
}

beforeAll(() => {
  // 注册字体
  registerFont(${importVarName});
});
`;

      // 生成测试用例（三层结构）
      const styleProps = [];
      styleProps.push(`fontFamily: '${fontFamily}'`);
      styleProps.push(`fontSize: ${fontSize}`);
      if (fontWeight !== 400) styleProps.push(`fontWeight: ${fontWeight}`);

      const testCase = `describe('${fontFamily}', () => {
  describe('[${fontSize}px] [${fontWeight}]', () => {
    it('"${r.text}"', () => {
      const metrics = measureText('${r.text}', {
        ${styleProps.join(',\n        ')}
      });

      // 浏览器 HTML 实际测量值 (from test-browser/index.html)
      expectWidthMatch(metrics.width, ${r.measured.width.toFixed(2)});
      expectHeightMatch(metrics.height, ${r.measured.actualHeight.toFixed(2)});
    });
  });
});`;

      const fullCode = imports + '\n' + testCase;
      document.getElementById('output').textContent = fullCode;
    }

    async function runAllTests() {
      // 生成标准化测试用例
      testCases = generateTestCases();

      if (testCases.length === 0) {
        alert('没有可用的字体，请确保字体已加载！');
        return;
      }

      const results = [];
      for (const testCase of testCases) {
        const result = await measureText(testCase.text, testCase.style);
        results.push({
          ...testCase,
          measured: result
        });
      }

      const resultsDiv = document.getElementById('testResults');
      resultsDiv.innerHTML = `<div style="margin-bottom: 10px; color: #666;">
        <strong>共 ${results.length} 个测试用例</strong>
      </div>` + results.map(r => `
        <div class="test-case">
          <h3>${r.name}</h3>
          ${buildSvgPreview(r.text, r.style, { width: r.measured.svgWidth, actualHeight: r.measured.svgHeight, baseline: r.measured.baseline })}
          <div class="results">
            <div><strong>字体:</strong> ${r.style.fontFamily}</div>
            <div><strong>文本:</strong> "${r.text}"</div>
            <div><strong>字号:</strong> ${r.style.fontSize}px</div>
            <div><strong>字重:</strong> ${r.style.fontWeight}</div>
            <div><strong>宽度 (目标 HTML):</strong> ${r.measured.width.toFixed(2)}px</div>
            <div><strong>高度 (计算):</strong> ${r.measured.height.toFixed(2)}px</div>
            <div><strong>高度 (目标 HTML):</strong> ${r.measured.actualHeight.toFixed(2)}px ${Math.abs(r.measured.height - r.measured.actualHeight) <= HEIGHT_ABS_TOLERANCE ? '✅' : '⚠️'}</div>
            <div><strong>高度 (SVG getBBox):</strong> ${r.measured.svgHeight.toFixed(2)}px</div>
            <div><strong>行高:</strong> ${r.measured.lineHeight.toFixed(2)}px</div>
            <div><strong>基线:</strong> ${r.measured.baseline.toFixed(2)}px</div>
          </div>
        </div>
      `).join('');

      // 保存结果供生成代码使用
      window.testResults = results;
    }

    function generateTestCode() {
      if (!window.testResults) {
        alert('请先运行测试！');
        return;
      }

      // 按字体分组，然后按字号+字重分组
      const fontGroups = {};
      window.testResults.forEach(r => {
        const font = r.style.fontFamily || 'default';
        const size = r.style.fontSize || 16;
        const weight = r.style.fontWeight || 400;

        if (!fontGroups[font]) {
          fontGroups[font] = {};
        }

        const sizeWeightKey = `${size}|${weight}`;
        if (!fontGroups[font][sizeWeightKey]) {
          fontGroups[font][sizeWeightKey] = {
            size,
            weight,
            tests: []
          };
        }

        fontGroups[font][sizeWeightKey].tests.push(r);
      });

      // 收集所有唯一的字体+字重组合（用于导入）
      const uniqueFontWeights = new Set();
      Object.keys(fontGroups).forEach(font => {
        Object.values(fontGroups[font]).forEach(group => {
          uniqueFontWeights.add(`${font}|${group.weight}`);
        });
      });

      // 生成导入语句
      const imports = `import { describe, expect, it, beforeAll } from 'vitest';
import { measureText, registerFont } from '../src';
${[...uniqueFontWeights].map(fontWeight => {
        const [font, weight] = fontWeight.split('|');
        const mapping = getFontMapping(font);
        const styleName = weightToStyle[weight] || 'Regular';
        const importVarName = `${mapping.varName}${styleName}`;
        return `import ${importVarName} from '../src/fonts/${mapping.fileName}-${styleName}';`;
      }).join('\n')}

const WIDTH_ABS_TOLERANCE = ${WIDTH_ABS_TOLERANCE};
const WIDTH_REL_TOLERANCE = ${WIDTH_REL_TOLERANCE};
const HEIGHT_ABS_TOLERANCE = ${HEIGHT_ABS_TOLERANCE};

function expectWidthMatch(actual: number, expected: number): void {
  const allowed = Math.max(WIDTH_ABS_TOLERANCE, Math.abs(expected) * WIDTH_REL_TOLERANCE);
  expect(Math.abs(actual - expected)).toBeLessThanOrEqual(allowed);
}

function expectHeightMatch(actual: number, expected: number): void {
  expect(Math.abs(actual - expected)).toBeLessThanOrEqual(HEIGHT_ABS_TOLERANCE);
}

beforeAll(() => {
  // 注册字体
${[...uniqueFontWeights].map(fontWeight => {
        const [font, weight] = fontWeight.split('|');
        const mapping = getFontMapping(font);
        const styleName = weightToStyle[weight] || 'Regular';
        const importVarName = `${mapping.varName}${styleName}`;
        return `  registerFont(${importVarName});`;
      }).join('\n')}
});
`;

      // 按字体生成测试用例（三层结构）
      const testGroups = Object.keys(fontGroups).map(font => {
        const sizeWeightGroups = fontGroups[font];

        // 第二层：按字号+字重分组
        const nestedDescribes = Object.keys(sizeWeightGroups).map(sizeWeightKey => {
          const { size, weight, tests } = sizeWeightGroups[sizeWeightKey];

          // 第三层：测试用例
          const testCases = tests.map(r => {
            const styleProps = [];
            if (r.style.fontFamily) styleProps.push(`fontFamily: '${r.style.fontFamily}'`);
            if (r.style.fontSize) styleProps.push(`fontSize: ${r.style.fontSize}`);
            if (r.style.fontWeight && r.style.fontWeight !== 400) styleProps.push(`fontWeight: ${r.style.fontWeight}`);

            return `    it('"${r.text}"', () => {
      const metrics = measureText('${r.text}', {
        ${styleProps.join(',\n        ')}
      });

      // 浏览器 HTML 实际测量值 (from test-browser/index.html)
      expectWidthMatch(metrics.width, ${r.measured.width.toFixed(2)});
      expectHeightMatch(metrics.height, ${r.measured.actualHeight.toFixed(2)});
    });`;
          }).join('\n\n');

          return `  describe('[${size}px] [${weight}]', () => {
${testCases}
  });`;
        }).join('\n\n');

        // 第一层：按字体分组
        return `describe('${font}', () => {
${nestedDescribes}
});`;
      }).join('\n\n');

      const fullCode = imports + '\n' + testGroups;
      document.getElementById('output').textContent = fullCode;
    }

    // 复制代码到剪贴板
    function copyOutputToClipboard() {
      const output = document.getElementById('output');
      const text = output.textContent;

      if (!text || text.trim() === '') {
        alert('没有可复制的代码，请先运行测试并生成代码！');
        return;
      }

      navigator.clipboard.writeText(text).then(() => {
        // 显示复制成功提示
        const feedback = document.getElementById('copyFeedback');
        feedback.classList.add('show');
        setTimeout(() => {
          feedback.classList.remove('show');
        }, 2000);
      }).catch(err => {
        // 降级方案：使用传统方法
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          const feedback = document.getElementById('copyFeedback');
          feedback.classList.add('show');
          setTimeout(() => {
            feedback.classList.remove('show');
          }, 2000);
        } catch (err) {
          alert('复制失败，请手动复制代码');
        }
        document.body.removeChild(textArea);
      });
    }
  </script>
